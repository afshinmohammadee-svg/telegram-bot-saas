name: Image storage PR checks

on:
  pull_request:
    branches:
      - railway/preview-adapter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Image asset unit tests
        run: npm run test:image-assets
      - name: TypeScript and production build
        run: npm run build
